name: Fresh Windows developer setup
on:
  pull_request:
    branches: [master, standard]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: checkout with spaces
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        working-directory: checkout with spaces
        run: v run scripts/check_demo_release.vsh compatibility
      - name: Install CI Vulkan runtime
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@04620525bab9fd843ad3b9046171aaff4dfe3d3c
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
      - name: Exercise the Windows bootstrap and V demo setup
        working-directory: checkout with spaces
        run: v run scripts/check_windows_setup.vsh "$env:RUNNER_TEMP\ImGui compiler with spaces"
