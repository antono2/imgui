name: Mobile native backends

on:
  pull_request:
    branches: [master, standard]
  push:
    paths-ignore: ['**/*.md']
    branches: [master, standard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imgui-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    name: Ubuntu Vulkan / FreeType offscreen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run ./scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run ./scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libglfw3-dev libvulkan-dev libfreetype-dev mesa-vulkan-drivers
      - name: Compile Linux backend and Vulkan GPU test
        run: v run scripts/check_native.vsh linux-build build/ci-linux
      - name: Render an offscreen ImGui frame with Lavapipe
        run: v run scripts/check_native.vsh linux-probes build/ci-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.linux_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build V compiler
        run: v run scripts/check_native.vsh compiler toolchain/v
      - name: Run V InputText selection callback smoke test
        run: v run scripts/check_native.vsh linux-callback build/ci-linux "${{ runner.temp }}"

  android:
    name: Android Vulkan / ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      ANDROID_NDK_HOME: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run ./scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run ./scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.linux_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build V compiler
        run: v run scripts/check_native.vsh compiler toolchain/v
      - name: Check V mobile APIs
        run: v run scripts/check_native.vsh android-api "${{ runner.temp }}" "${{ matrix.abi }}"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK and API
        run: v run scripts/check_android.vsh install
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android IME Java bridge
        run: v run scripts/check_android.vsh java "${{ runner.temp }}/vimgui-java"
      - name: Cross-build Android native bindings and verify probe exports
        run: v run scripts/check_android.vsh probes
      - name: Cross-link a V Android app
        if: matrix.abi == 'armeabi-v7a'
        run: v run scripts/check_android.vsh arm-link "${{ runner.temp }}"
      - name: Cross-build V UI and verify Android NativeActivity APK
        run: v run scripts/check_android.vsh demo
      - name: Build and verify the signed native accessibility fixture
        if: matrix.abi == 'x86_64'
        run: v run scripts/check_android.vsh accessible

  apple:
    name: ${{ matrix.sdk }} / ${{ matrix.arch }} Metal
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: macosx
            arch: x86_64
          - sdk: iphonesimulator
            arch: arm64
          - sdk: iphonesimulator
            arch: x86_64
          - sdk: iphoneos
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run ./scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run ./scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.arch == 'ARM64'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.macos_arm64_tcc }} # thirdparty-macos-arm64
          path: toolchain/v/thirdparty/tcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.arch == 'X64'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.macos_x64_tcc }} # thirdparty-macos-amd64
          path: toolchain/v/thirdparty/tcc
      - name: Build V compiler
        run: v run scripts/check_native.vsh compiler toolchain/v clang
      - name: Check V Apple APIs
        run: v run scripts/check_native.vsh apple-api "${{ runner.temp }}" "${{ matrix.sdk }}" "${{ matrix.arch }}"
      - name: Build Apple native bindings and Metal smoke test
        run: v run scripts/check_native.vsh apple-build build/ci-apple "${{ matrix.sdk }}" "${{ matrix.arch }}"
      - name: Cross-link a V Apple consumer
        run: v run scripts/check_native.vsh apple-link build/ci-apple "${{ runner.temp }}" "${{ matrix.sdk }}" "${{ matrix.arch }}"
      - name: Verify architecture and wrapper export
        run: v run scripts/check_native.vsh apple-verify build/ci-apple "${{ matrix.sdk }}" "${{ matrix.arch }}"
      - name: Attempt an iOS Simulator Metal frame
        if: matrix.sdk == 'iphonesimulator' && ((matrix.arch == 'x86_64' && runner.arch == 'X64') || (matrix.arch == 'arm64' && runner.arch == 'ARM64'))
        continue-on-error: true
        timeout-minutes: 15
        run: v run scripts/run_ios_simulator_smoke.vsh build/ci-apple/vimgui_ios_demo.app

  mobile-required-checks:
    name: mobile-required-checks
    if: always()
    needs: [linux-vulkan, android, apple]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required mobile jobs
        env:
          LINUX_RESULT: ${{ needs.linux-vulkan.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$APPLE_RESULT" = success
