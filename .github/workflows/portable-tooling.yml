name: Portable V tooling

on:
  pull_request:
    branches: [master, standard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./scripts/test_compatibility.py
          python ./scripts/test_doctor.py
          python ./scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'Linux'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.linux_tcc }}
          path: toolchain/v/thirdparty/tcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.macos_arm64_tcc }} # thirdparty-macos-arm64
          path: toolchain/v/thirdparty/tcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: runner.os == 'macOS' && runner.arch == 'X64'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.macos_x64_tcc }} # thirdparty-macos-amd64
          path: toolchain/v/thirdparty/tcc
      - name: Build V on Unix
        if: runner.os != 'Windows'
        run: |
          make -C toolchain/v local=1
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Build V on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -msvc --local
      - name: Test executable scripts on Unix
        if: runner.os != 'Windows'
        run: |
          ./setup.vsh --help
          ./build_vimgui.vsh --help
          ./generate.vsh --help
          ./generate.vsh --self-test
          ./scripts/run_demo.vsh --help
          ./scripts/check_prerequisites.vsh --help
          ./scripts/build_appui.vsh --help
          ./scripts/extract_zip.vsh --help
          ./scripts/setup_vulkan_ci.vsh --help
          test -x scripts/check_mobile_parity.sh
          v test scripts/tooling
      - name: Test the same scripts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $V = "$env:GITHUB_WORKSPACE\toolchain\v\v.exe"
          foreach ($Script in @('setup.vsh', 'build_vimgui.vsh', 'generate.vsh', 'scripts/run_demo.vsh', 'scripts/check_prerequisites.vsh', 'scripts/build_appui.vsh', 'scripts/extract_zip.vsh', 'scripts/setup_vulkan_ci.vsh')) {
            & $V -cc msvc run $Script --help
            if ($LASTEXITCODE -ne 0) { throw "$Script failed" }
          }
          & $V -cc msvc run generate.vsh --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Generator subprocess tests failed' }
          & $V -cc msvc test scripts/tooling
          if ($LASTEXITCODE -ne 0) { throw 'Portable tooling tests failed' }
