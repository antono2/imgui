name: Prebuilt demo

on:
  pull_request:
    branches: [master, standard]
  push:
    paths-ignore: ['**/*.md']
    branches: [master, standard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imgui-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu24:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Resolve tested demo compatibility
        id: compat
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/v_imgui_examples
          ref: ${{ steps.compat.outputs.demo_release }}
          path: source/demo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.linux_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build official V compiler
        run: v run source/modules/antono2/imgui/scripts/check_native.vsh compiler toolchain/v
      - name: Verify the declared dependency graph
        run: v run source/modules/antono2/imgui/scripts/check_installed_deps.vsh
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev patchelf pkg-config mesa-vulkan-drivers xauth xvfb
      - name: Verify generated upstream variant and build entry points
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh variant
      - name: Compile V demo
        run: v run source/modules/antono2/imgui/scripts/run_demo.vsh --build-only --demo-directory source/demo
      - name: Package and verify
        id: variant
        working-directory: source/modules/antono2/imgui
        run: >-
          v run scripts/package_ubuntu_demo.vsh
          --output-directory "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT" --smoke
      - name: Upload Ubuntu demo package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/v-imgui-demo-${{ steps.variant.outputs.name }}-ubuntu24-amd64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Resolve tested demo compatibility
        id: compat
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/v_imgui_examples
          ref: ${{ steps.compat.outputs.demo_release }}
          path: source/demo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - name: Set up MSVC x64
        uses: antono2/vulkan/.github/actions/setup-msvc@23ec75dc6015776f3012880148ca90e66f63010a
      - name: Build official V compiler
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -msvc --local
      - name: Add V compiler to PATH
        run: v run source/modules/antono2/imgui/scripts/check_native.vsh compiler-path toolchain/v
      - name: Verify the declared dependency graph
        run: v run source/modules/antono2/imgui/scripts/check_installed_deps.vsh
      - name: Install Vulkan SDK and SwiftShader test artifacts
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@0c2a5f832ea6792df3f34a6e1ef7390743162bd1
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
          volk-revision: ${{ steps.compat.outputs.volk }}
      - name: Check Windows setup entry point syntax
        working-directory: source/modules/antono2/imgui
        run: v -check-syntax setup.vsh
      - name: Build Windows demo and native libraries
        working-directory: source/modules/antono2/imgui
        run: v run scripts/run_demo.vsh --build-only --demo-directory "$env:GITHUB_WORKSPACE\source\demo"
      - name: Package and verify
        id: variant
        working-directory: source/modules/antono2/imgui
        run: >-
          v run scripts/package_windows_demo.vsh --output-directory "$env:RUNNER_TEMP"
          --github-output "$env:GITHUB_OUTPUT"
      - name: Upload Windows demo package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.temp }}/v-imgui-demo-${{ steps.variant.outputs.name }}-windows-x64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  strict-v3-frontend:
    name: Required pinned V3 frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Resolve tested demo compatibility
        id: compat
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/v_imgui_examples
          ref: ${{ steps.compat.outputs.demo_release }}
          path: source/demo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v3_v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.v3_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        run: v run source/modules/antono2/imgui/scripts/check_native.vsh compiler toolchain/v
      - name: Verify the declared dependency graph
        run: v run source/modules/antono2/imgui/scripts/check_installed_deps.vsh
      - name: Check generated bindings and demo
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh frontend source/demo

  linux-v-master:
    name: Advisory current V master and dependency masters
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Resolve tested demo compatibility
        id: compat
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh compatibility
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/v_imgui_examples
          ref: ${{ steps.compat.outputs.demo_release }}
          path: source/demo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: master
          path: toolchain/v
      - name: Build current V master
        run: v run source/modules/antono2/imgui/scripts/check_native.vsh compiler toolchain/v master
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config
      - name: Stage headers matching Vulkan master
        uses: antono2/vulkan/.github/actions/stage-vulkan-headers@0c2a5f832ea6792df3f34a6e1ef7390743162bd1
        with:
          bindings-path: source/modules/antono2/vulkan
      - name: Check generated bindings with V3
        working-directory: source/modules/antono2/imgui
        run: |
          v -check-syntax imgui.v
          v -check-syntax implot/implot.v
      - name: Check demo APIs against dependency masters
        run: v -new-compiler -check -path "$VMODULES/antono2|@vlib|@vmodules" source/demo
      - name: Build and link moving-dependency consumer
        run: v run source/modules/antono2/imgui/scripts/check_demo_release.vsh moving-consumer "$RUNNER_TEMP"

  required-checks:
    if: always()
    needs: [ubuntu24, windows-native, strict-v3-frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu24.result }}
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
          V3_RESULT: ${{ needs.strict-v3-frontend.result }}
        run: |
          test "$UBUNTU_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$V3_RESULT" = success
