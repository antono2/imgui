name: Prebuilt demo

on:
  pull_request:
    branches: [master, standard]
  push:
    branches: [master, standard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imgui-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu24:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: antono2/vulkan
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: antono2/glfw
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: antono2/v_imgui_examples
          ref: c2b5083d42f052cfe73952542e86e4163c64ce79
          path: source/demo
      - uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: 1f128c94619fb6e4863c5f81883e1b860405c8fa
          path: toolchain/v
      - name: Build official V compiler
        working-directory: toolchain/v
        run: |
          make
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev patchelf pkg-config xvfb zip
      - name: Verify generated upstream variant
        working-directory: source/modules/antono2/imgui
        run: ./scripts/check_upstream_variant.sh
      - name: Select package variant
        id: variant
        working-directory: source/modules/antono2/imgui
        run: |
          variant=$(tr -d '[:space:]' < UPSTREAM_VARIANT)
          case "$variant" in
            docking|standard) ;;
            *) echo "Unsupported ImGui variant: $variant" >&2; exit 1 ;;
          esac
          echo "name=$variant" >> "$GITHUB_OUTPUT"
      - name: Build native ImGui library
        working-directory: source/modules/antono2/imgui
        run: |
          v run build_vimgui.vsh --help
          v run build_vimgui.vsh --linkage shared --glfw system
      - name: Compile V demo
        run: v -no-memory-limit -path "$GITHUB_WORKSPACE/source/modules/antono2|@vlib|@vmodules" -cc gcc -o "$RUNNER_TEMP/v_imgui_demo" source/demo
      - name: Package and verify
        run: |
          set -euo pipefail
          variant='${{ steps.variant.outputs.name }}'
          package="$RUNNER_TEMP/v-imgui-demo-${variant}-ubuntu24-amd64"
          install -d "$package/lib"
          install -m 0755 "$RUNNER_TEMP/v_imgui_demo" "$package/v_imgui_demo"
          install -m 0755 source/modules/antono2/imgui/lib/libvimgui.so "$package/lib/libvimgui.so"
          install -m 0755 /usr/lib/x86_64-linux-gnu/libglfw.so.3 "$package/lib/libglfw.so.3"
          install -m 0755 /usr/lib/x86_64-linux-gnu/libstdc++.so.6 "$package/lib/libstdc++.so.6"
          install -m 0755 /lib/x86_64-linux-gnu/libgcc_s.so.1 "$package/lib/libgcc_s.so.1"
          install -m 0755 source/modules/antono2/imgui/packaging/demo/ubuntu24/run.sh "$package/run.sh"
          install -m 0644 source/modules/antono2/imgui/packaging/demo/ubuntu24/README.txt "$package/README.txt"
          install -m 0644 source/modules/antono2/imgui/UPSTREAM_VARIANT "$package/VARIANT.txt"
          strip --strip-unneeded "$package/v_imgui_demo" "$package/lib/libvimgui.so"
          patchelf --set-rpath '$ORIGIN/lib' "$package/v_imgui_demo"
          patchelf --set-rpath '$ORIGIN' "$package/lib/libvimgui.so"
          test "$(patchelf --print-rpath "$package/v_imgui_demo")" = '$ORIGIN/lib'
          test "$(patchelf --print-rpath "$package/lib/libvimgui.so")" = '$ORIGIN'
          ldd "$package/v_imgui_demo" | tee "$RUNNER_TEMP/ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/ldd.txt"
          for library in libvimgui.so libglfw.so.3 libstdc++.so.6 libgcc_s.so.1; do
            grep -F "$package/lib/$library" "$RUNNER_TEMP/ldd.txt"
          done
          archive="$(basename "$package").zip"
          (cd "$RUNNER_TEMP" && zip -qr "$archive" "$(basename "$package")")
          unzip -t "$RUNNER_TEMP/$archive" >/dev/null
          sha256sum "$RUNNER_TEMP/$archive"
      - name: Upload Ubuntu demo package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/v-imgui-demo-${{ steps.variant.outputs.name }}-ubuntu24-amd64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  windows-native:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: antono2/vulkan
          ref: d9ad9fc5151aa19f58cd2fed1b6bcda9b210f098
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: antono2/glfw
          ref: 3d7c1ddacb7215a7bbeb5fef0d7a68c90ba392ed
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: antono2/v_imgui_examples
          ref: c2b5083d42f052cfe73952542e86e4163c64ce79
          path: source/demo
      - uses: actions/checkout@v7
        with:
          repository: vlang/v
          ref: 1f128c94619fb6e4863c5f81883e1b860405c8fa
          path: toolchain/v
      - uses: actions/checkout@v7
        with:
          repository: zeux/volk
          ref: 58689c063427f5bad4f133625049b1a3c5dd8287
          path: source/third_party/volk
      - name: Build official V compiler
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat
      - name: Add V compiler to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Vulkan SDK and SwiftShader test artifacts
        shell: bash
        run: bash source/modules/antono2/imgui/.github/scripts/setup-vulkan-ci.sh 1.4.309.0 v1.2
      - name: Install matching Volk header
        shell: pwsh
        run: |
          $Destination = Join-Path $env:VULKAN_SDK "Include\volk"
          New-Item -ItemType Directory -Force $Destination | Out-Null
          Copy-Item source/third_party/volk/volk.h, source/third_party/volk/volk.c $Destination
      - name: Select package variant
        id: variant
        shell: pwsh
        run: |
          $Variant = (Get-Content source/modules/antono2/imgui/UPSTREAM_VARIANT -Raw).Trim()
          if ($Variant -notin @("docking", "standard")) {
            throw "Unsupported ImGui variant: $Variant"
          }
          "name=$Variant" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build Windows demo and native libraries
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $InstallPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $InstallPath) { throw 'Visual Studio C++ tools were not found' }
          Import-Module (Join-Path $InstallPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $InstallPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./source/modules/antono2/imgui/scripts/run_demo_windows.ps1 -BuildOnly -DemoDirectory "$env:GITHUB_WORKSPACE\source\demo"
      - name: Package and verify
        shell: pwsh
        run: |
          $Variant = '${{ steps.variant.outputs.name }}'
          $Source = "$env:GITHUB_WORKSPACE\source\modules\antono2\imgui"
          $Runtime = "$Source\build\windows-demo"
          $PackageName = "v-imgui-demo-$Variant-windows-x64"
          $Package = Join-Path $env:RUNNER_TEMP $PackageName
          New-Item -ItemType Directory -Force $Package | Out-Null
          Copy-Item "$Runtime\v_imgui_demo.exe" $Package
          Copy-Item "$Runtime\vimgui.dll" $Package
          Copy-Item "$Runtime\glfw3.dll" $Package
          Copy-Item "$Source\packaging\demo\windows\README.txt" $Package
          Copy-Item "$Source\UPSTREAM_VARIANT" "$Package\VARIANT.txt"
          foreach ($File in @("v_imgui_demo.exe", "vimgui.dll", "glfw3.dll", "README.txt", "VARIANT.txt")) {
            if (-not (Test-Path (Join-Path $Package $File))) { throw "Missing package file: $File" }
          }
          if ((Get-Content "$Package\VARIANT.txt" -Raw).Trim() -ne $Variant) {
            throw "Packaged variant marker does not match $Variant"
          }
          $Archive = Join-Path $env:RUNNER_TEMP "$PackageName.zip"
          Compress-Archive -Path $Package -DestinationPath $Archive
          $Extracted = Join-Path $env:RUNNER_TEMP "verify-$PackageName"
          Expand-Archive -Path $Archive -DestinationPath $Extracted
          foreach ($File in @("v_imgui_demo.exe", "vimgui.dll", "glfw3.dll", "README.txt", "VARIANT.txt")) {
            if (-not (Test-Path "$Extracted\$PackageName\$File")) { throw "Archive is missing: $File" }
          }
          Get-FileHash -Algorithm SHA256 $Archive
      - name: Upload Windows demo package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/v-imgui-demo-${{ steps.variant.outputs.name }}-windows-x64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error

  required-checks:
    if: always()
    needs: [ubuntu24, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          UBUNTU_RESULT: ${{ needs.ubuntu24.result }}
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
        run: |
          test "$UBUNTU_RESULT" = success
          test "$WINDOWS_RESULT" = success
