name: Mobile branch parity

on:
  schedule:
    - cron: '16 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-mobile-files:
    name: Compare master and standard mobile integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./scripts/test_compatibility.py
          python ./scripts/test_doctor.py
          python ./scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - name: Compare shared mobile files
        run: |
          git fetch origin master standard
          ./scripts/check_mobile_parity.sh origin/master origin/standard
