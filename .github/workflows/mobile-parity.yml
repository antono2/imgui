name: Mobile branch parity

on:
  schedule:
    - cron: '16 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-mobile-files:
    name: Compare master and standard mobile integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run ./scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run ./scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - name: Compare shared mobile files
        run: |
          git fetch origin master standard
          ./scripts/check_mobile_parity.sh origin/master origin/standard
